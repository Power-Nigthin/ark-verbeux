<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelArk – Survie et apprivoisement de dinos en pixel art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="270"></canvas>
<canvas id="hud"></canvas>
<div id="creator"><div class="panel">
  <h1>Crée ton survivant</h1>
  <div class="row">
    <canvas id="pv" width="72" height="104"></canvas>
    <div class="opts">
      <label>Nom <input id="name" maxlength="16" value="Survivant"></label>
      <label>Type <select id="sex"><option value="0">A</option><option value="1">B</option></select></label>
      <label>Corpulence <select id="build"><option value="0">Mince</option><option value="1" selected>Normale</option><option value="2">Costaud</option></select></label>
      <label>Coiffure <select id="hair"><option value="0">Chauve</option><option value="1" selected>Court</option><option value="2">Long</option><option value="3">Queue</option><option value="4">Crête</option></select></label>
      <label>Barbe <select id="beard"><option value="0">Aucune</option><option value="1">Moustache</option><option value="2">Barbe</option></select></label>
      <label>Peau <input type="range" id="skin" min="0" max="5" value="1"></label>
      <label>Cheveux <input type="range" id="hairc" min="0" max="7" value="1"></label>
      <label>Yeux <input type="range" id="eyec" min="0" max="4" value="0"></label>
    </div>
  </div>
  <p id="info"></p>
  <div class="btns"><button id="rnd">Aléatoire</button><button id="go">Jouer</button></div>
</div></div>
</div>
<script src="game.js"></script>
</body>
</html>
